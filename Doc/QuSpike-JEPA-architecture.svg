<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1100" height="620" fill="#ffffff"/>
  <text x="550" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">QuSpike-JEPA 架構</text>

  <!-- column headers -->
  <g fill="#64748b" font-size="12" text-anchor="middle">
    <text x="85" y="62">輸入</text>
    <text x="255" y="62">View 生成</text>
    <text x="430" y="62">古典編碼器（共享權重）</text>
    <text x="640" y="62">量子預測器（共享 θ）</text>
    <text x="840" y="62">嵌入</text>
    <text x="985" y="62">目標</text>
  </g>

  <!-- sequences -->
  <rect x="20" y="95" width="130" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="85" y="122" text-anchor="middle" fill="#0f172a">序列 s</text>
  <text x="85" y="142" text-anchor="middle" font-size="11" fill="#64748b">Spike 突變集合</text>

  <rect x="20" y="305" width="130" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="85" y="332" text-anchor="middle" fill="#0f172a">序列 s′</text>
  <text x="85" y="352" text-anchor="middle" font-size="11" fill="#64748b">同世界狀態</text>

  <!-- views -->
  <rect x="195" y="95" width="120" height="64" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="255" y="122" text-anchor="middle" fill="#0f172a">view x_a</text>
  <text x="255" y="142" text-anchor="middle" font-size="11" fill="#92400e">trim + mask 15%</text>
  <rect x="195" y="305" width="120" height="64" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="255" y="332" text-anchor="middle" fill="#0f172a">view x_b</text>
  <text x="255" y="352" text-anchor="middle" font-size="11" fill="#92400e">trim + mask 15%</text>

  <line x1="150" y1="127" x2="193" y2="127" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="150" y1="337" x2="193" y2="337" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- encoder (single tall box, shared) -->
  <rect x="355" y="85" width="150" height="295" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-dasharray="6 4"/>
  <text x="430" y="226" text-anchor="middle" font-weight="bold" fill="#1e3a8a">古典編碼器 f_φ</text>
  <text x="430" y="248" text-anchor="middle" font-size="11" fill="#1e3a8a">位置+胺基酸嵌入</text>
  <text x="430" y="264" text-anchor="middle" font-size="11" fill="#1e3a8a">Transformer / DeepSets</text>
  <text x="430" y="284" text-anchor="middle" font-size="11" fill="#1e3a8a">z̃ = π·tanh(z)</text>
  <text x="430" y="304" text-anchor="middle" font-size="11" fill="#1e3a8a">（共享權重）</text>

  <line x1="315" y1="127" x2="353" y2="127" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="315" y1="337" x2="353" y2="337" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- z labels and arrows to quantum -->
  <line x1="505" y1="127" x2="560" y2="127" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="532" y="118" text-anchor="middle" fill="#0f172a">z_a</text>
  <line x1="505" y1="337" x2="560" y2="337" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="532" y="328" text-anchor="middle" fill="#0f172a">z_b</text>

  <!-- quantum predictors -->
  <g>
    <rect x="560" y="85" width="160" height="84" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="640" y="108" text-anchor="middle" font-weight="bold" fill="#4c1d95">量子預測器 U(z̃;θ)</text>
    <text x="640" y="127" text-anchor="middle" font-size="11" fill="#4c1d95">n qubits，L 層重複編碼</text>
    <text x="640" y="143" text-anchor="middle" font-size="11" fill="#4c1d95">R_y(a·z̃+b) · W(Ry/Rz+CZ)</text>
    <text x="640" y="159" text-anchor="middle" font-size="11" fill="#4c1d95">量測 ⟨Z_i⟩, ⟨Z_iZ_j⟩</text>
  </g>
  <g>
    <rect x="560" y="295" width="160" height="84" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="640" y="318" text-anchor="middle" font-weight="bold" fill="#4c1d95">量子預測器 U(z̃;θ)</text>
    <text x="640" y="337" text-anchor="middle" font-size="11" fill="#4c1d95">n qubits，L 層重複編碼</text>
    <text x="640" y="353" text-anchor="middle" font-size="11" fill="#4c1d95">R_y(a·z̃+b) · W(Ry/Rz+CZ)</text>
    <text x="640" y="369" text-anchor="middle" font-size="11" fill="#4c1d95">量測 ⟨Z_i⟩, ⟨Z_iZ_j⟩</text>
  </g>
  <!-- shared theta link -->
  <line x1="640" y1="169" x2="640" y2="295" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="598" y="219" width="84" height="26" rx="13" fill="#ffffff" stroke="#7c3aed"/>
  <text x="640" y="237" text-anchor="middle" font-size="12" fill="#4c1d95">共享 θ, a, b</text>

  <!-- q -->
  <line x1="720" y1="127" x2="790" y2="127" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="720" y1="337" x2="790" y2="337" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="792" y="105" width="96" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="840" y="125" text-anchor="middle" fill="#14532d">q_a ∈ [−1,1]^m</text>
  <text x="840" y="141" text-anchor="middle" font-size="11" fill="#166534">三角多項式 deg≤L</text>
  <rect x="792" y="315" width="96" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="840" y="335" text-anchor="middle" fill="#14532d">q_b ∈ [−1,1]^m</text>
  <text x="840" y="351" text-anchor="middle" font-size="11" fill="#166534">三角多項式 deg≤L</text>

  <!-- loss -->
  <path d="M888,127 H915 V215" fill="none" stroke="#475569" stroke-width="1.6"/>
  <path d="M888,337 H915 V255" fill="none" stroke="#475569" stroke-width="1.6" />
  <line x1="915" y1="215" x2="935" y2="225" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="915" y1="255" x2="935" y2="245" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="938" y="180" width="140" height="110" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="1008" y="204" text-anchor="middle" font-weight="bold" fill="#7f1d1d">訓練損失</text>
  <text x="1008" y="228" text-anchor="middle" font-size="12" fill="#7f1d1d">L_inv = E‖q_a − q_b‖²</text>
  <text x="1008" y="248" text-anchor="middle" font-size="12" fill="#7f1d1d">+ λ·抗塌陷</text>
  <text x="1008" y="266" text-anchor="middle" font-size="11" fill="#991b1b">二階白化 / SIGReg</text>
  <text x="1008" y="282" text-anchor="middle" font-size="11" fill="#991b1b">（有界輸出，見 R2）</text>

  <!-- gradient return -->
  <path d="M1008,290 V420 H430 V382" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <path d="M1008,420 H640 V381" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="725" y="437" text-anchor="middle" font-size="11" fill="#991b1b">梯度（量子端：自動微分 / parameter-shift）</text>

  <!-- downstream -->
  <rect x="20" y="475" width="1060" height="125" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="500" font-weight="bold" fill="#0f172a">下游評估（凍結編碼器與量子頭）</text>
  <rect x="80" y="520" width="140" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="150" y="544" text-anchor="middle" fill="#0f172a">序列 s</text>
  <text x="150" y="562" text-anchor="middle" font-size="11" fill="#64748b">不做 trim/mask</text>
  <line x1="220" y1="548" x2="262" y2="548" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="264" y="520" width="160" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="344" y="544" text-anchor="middle" fill="#1e3a8a">f_φ → z̃</text>
  <text x="344" y="562" text-anchor="middle" font-size="11" fill="#1e3a8a">凍結</text>
  <line x1="424" y1="548" x2="466" y2="548" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="468" y="520" width="160" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="548" y="544" text-anchor="middle" fill="#4c1d95">U(z̃;θ) → q</text>
  <text x="548" y="562" text-anchor="middle" font-size="11" fill="#4c1d95">凍結（亦可直接用 z̃）</text>
  <line x1="628" y1="548" x2="670" y2="548" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="672" y="520" width="160" height="56" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="752" y="544" text-anchor="middle" fill="#14532d">線性 probe / kNN</text>
  <text x="752" y="562" text-anchor="middle" font-size="11" fill="#166534">5 種子，F1-macro 為主</text>
  <line x1="832" y1="548" x2="874" y2="548" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="876" y="520" width="180" height="56" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="966" y="544" text-anchor="middle" fill="#0f172a">Pango 譜系（22 類）</text>
  <text x="966" y="562" text-anchor="middle" font-size="11" fill="#92400e">70/30×5 fold + 時間切分</text>
</svg>
