<line x1="970" y1="385" x2="1020" y2="385" stroke="#92400e" stroke-width="2"/>
<text x="995.0" y="405" text-anchor="middle" font-size="12" fill="#92400e">量測</text>
<rect x="1050" y="105" width="250" height="275" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="1175" y="130" text-anchor="middle" font-weight="bold" fill="#0f172a">讀出</text>
<text x="1062" y="158" font-size="12" fill="#0f172a">p = ( ⟨Z₁⟩, ⟨Z₂⟩, ⟨Z₃⟩, ⟨Z₄⟩,</text>
<text x="1062" y="180" font-size="12" fill="#0f172a">　　⟨Z₁Z₂⟩, ⟨Z₂Z₃⟩,</text>
<text x="1062" y="202" font-size="12" fill="#0f172a">　　⟨Z₃Z₄⟩, ⟨Z₄Z₁⟩ )</text>
<text x="1062" y="224" font-size="12" fill="#0f172a">p ∈ [−1,1]^(2n)　（n=4 → 8 維）</text>
<text x="1175" y="262" text-anchor="middle" font-size="18" fill="#475569">↓ 線性層 C</text>
<text x="1062" y="288" font-size="12" fill="#0f172a">q = C·p　（= 可訓練觀測量）</text>
<text x="1062" y="310" font-size="12" fill="#0f172a">q ∈ ℝ^m，作為嵌入：</text>
<text x="1062" y="330" font-size="12" fill="#0f172a">L_inv(q_a, q_b) + 抗塌陷</text>
<text x="1062" y="350" font-size="12" fill="#0f172a">以及下游線性 probe</text>
<rect x="20" y="425" width="1280" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="40" y="450" font-weight="bold" fill="#0f172a">怎麼讀這張圖</text>
<rect x="40" y="462" width="26" height="18" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
<text x="76" y="476" font-size="12" fill="#0f172a">Rz(α)、Ry(β)：可訓練旋轉角（每個 qubit 各自一組 α、β）</text>
<circle cx="53" cy="502" r="5" fill="#7c3aed"/><line x1="53" y1="502" x2="53" y2="512" stroke="#7c3aed" stroke-width="2"/><circle cx="53" cy="512" r="5" fill="#7c3aed"/>
<text x="76" y="512" font-size="12" fill="#0f172a">CZ：糾纏閘；W 後接環狀 CZ（q1–q2、q2–q3、q3–q4、q4–q1），讓各特徵的資訊互相混合</text>
<rect x="40" y="526" width="26" height="18" rx="4" fill="#dcfce7" stroke="#16a34a"/>
<text x="76" y="540" font-size="12" fill="#0f172a">Ry(z̃ᵢ + b)：資料編碼；把古典潛向量的第 i 個分量 z̃ᵢ 寫成 qubit i 的旋轉角（預設 a=1，b 可訓練）</text>
<text x="40" y="570" font-size="12" fill="#0f172a">• 同一個 z̃ᵢ 在 S₁、S₂ 每層都重新輸入（data re-uploading）。若只輸入一次，q 只能是 z̃ᵢ 的單頻 sin 函數；L 層可得到最高 L 階的三角多項式。</text>
<text x="40" y="590" font-size="12" fill="#0f172a">• 最後的 W³ 不接 CZ：CZ 是對角閘，與 Z 量測可交換，加了也不改變任何 ⟨Z⟩、⟨ZZ⟩，只是浪費閘數。</text>
<text x="40" y="610" font-size="12" fill="#0f172a">• 兩個 view（x_a、x_b）各跑一次同一條線路、共用所有 α、β、b、C；每次量測 8 個期望值（n=4）；參數量（a=1 固定）3nL + 2n，此圖 = 3×4×2+8 = 32；a 也可訓練則 4nL + 2n = 40。</text>
</svg>