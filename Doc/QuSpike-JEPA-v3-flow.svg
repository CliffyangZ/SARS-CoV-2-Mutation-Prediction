<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1046" font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="ars" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/>
    </marker>
  </defs>
  <rect width="1000" height="1046" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">QuSpike-JEPA 修訂版（v3）資料流</text>
  <text x="500" y="56" text-anchor="middle" font-size="12" fill="#64748b">實線＝fine-tune／推論路徑　·　紅色虛線＝僅預訓練時存在　·　藍色＝跳接通道</text>

  <!-- ===== 主幹 ===== -->
  <!-- 1 序列 -->
  <rect x="290" y="80" width="420" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="500" y="108" text-anchor="middle" fill="#0f172a">序列 s</text>
  <text x="500" y="129" text-anchor="middle" font-size="11" fill="#64748b">Spike 胺基酸序列，1,273 位</text>
  <line x1="500" y1="144" x2="500" y2="174" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 2 對齊 + 突變集合 -->
  <rect x="290" y="176" width="420" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="500" y="204" text-anchor="middle" fill="#0f172a">對齊 Wuhan-Hu-1 → 突變集合 {(位置, 胺基酸)}</text>
  <text x="500" y="225" text-anchor="middle" font-size="11" fill="#64748b">每條平均 8.1 個（中位數 10）　·　詞彙 V = 3,686</text>
  <line x1="500" y1="240" x2="500" y2="270" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 3 V-D 視角 -->
  <rect x="290" y="272" width="420" height="78" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="500" y="298" text-anchor="middle" fill="#0f172a">V-D 視角（只對定序 nuisance 不變）</text>
  <text x="500" y="318" text-anchor="middle" font-size="11" fill="#92400e">依訓練集分佈注入 X 連續缺失　+　首尾截斷 2%</text>
  <text x="500" y="337" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">不遮蔽、不丟棄任何突變身分</text>
  <line x1="500" y1="350" x2="500" y2="374" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 4 編碼器 -->
  <rect x="290" y="376" width="420" height="64" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="500" y="404" text-anchor="middle" fill="#0f172a">DeepSets 編碼器 f_φ（兩個 view 共享權重）</text>
  <text x="500" y="425" text-anchor="middle" font-size="11" fill="#1e40af">位置嵌入 + 胺基酸嵌入 → 集合池化</text>
  <line x1="500" y1="440" x2="500" y2="470" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="512" y="461" font-size="11" fill="#475569">u ∈ ℝ¹²⁸（d_z 與 n 解開）</text>

  <!-- 5 角度映射 -->
  <rect x="290" y="472" width="420" height="64" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="500" y="500" text-anchor="middle" fill="#0f172a">角度映射 A：ℝ¹²⁸ → ℝ⁶⁴</text>
  <text x="500" y="521" text-anchor="middle" font-size="11" fill="#1e40af">z̃ = (π/2)·tanh(A u) ∈ ℝ^(8×8)，落在 R_y 週期內且首尾不重疊</text>
  <line x1="500" y1="536" x2="500" y2="566" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="512" y="557" font-size="11" fill="#475569">z̃⁽¹⁾ … z̃⁽⁸⁾</text>

  <!-- 6 量子線路 -->
  <rect x="290" y="568" width="420" height="86" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="500" y="594" text-anchor="middle" fill="#0f172a">H = 8 個並聯量子線路 U(z̃⁽ʰ⁾; θ⁽ʰ⁾)</text>
  <text x="500" y="614" text-anchor="middle" font-size="11" fill="#5b21b6">n = 8 qubits　·　L = 2 層 data re-uploading　·　θ 各頭獨立</text>
  <text x="500" y="632" text-anchor="middle" font-size="11" fill="#5b21b6">預設無糾纏、固定觀測量　·　線路參數 512（全模型的 0.2%）</text>
  <text x="500" y="648" text-anchor="middle" font-size="10" fill="#7c3aed">固定 a = 1 → q 對 z̃ 的三角多項式度數 ≤ L（Schuld 式 25）</text>
  <line x1="500" y1="654" x2="500" y2="678" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 7 讀出 -->
  <rect x="290" y="680" width="420" height="78" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="500" y="706" text-anchor="middle" fill="#0f172a">讀出 p ∈ ℝ¹²⁸　（m = H·2n）</text>
  <text x="500" y="726" text-anchor="middle" font-size="11" fill="#5b21b6">每頭取 ⟨Z_i⟩ 與環上 ⟨Z_i Z_{i+1}⟩，共 2n = 16 維</text>
  <text x="500" y="745" text-anchor="middle" font-size="11" fill="#5b21b6">線性 C（等價於可訓練觀測量）→ q，且 |q| 有界</text>
  <line x1="500" y1="758" x2="500" y2="788" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="512" y="779" font-size="11" fill="#475569">q</text>

  <!-- 8 相加 -->
  <rect x="290" y="790" width="420" height="68" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="500" y="818" text-anchor="middle" font-weight="bold" fill="#0f172a">logits = W_q · q　+　W_s · x_mut　+　b</text>
  <text x="500" y="841" text-anchor="middle" font-size="11" fill="#15803d">令 W_q = 0 即還原監督線性參考線 → 參考線是架構上的下限</text>
  <line x1="500" y1="858" x2="500" y2="888" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 9 輸出 -->
  <rect x="290" y="890" width="420" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="500" y="916" text-anchor="middle" fill="#0f172a">22 類 Pango 譜系</text>
  <text x="500" y="936" text-anchor="middle" font-size="11" fill="#15803d">交叉熵 fine-tune 20 epochs　·　主指標 macro F1</text>

  <!-- ===== 跳接通道（右） ===== -->
  <polyline points="710,208 860,208 860,270" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#ars)"/>
  <rect x="740" y="272" width="240" height="96" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="860" y="298" text-anchor="middle" fill="#0f172a">跳接通道 W_s</text>
  <text x="860" y="318" text-anchor="middle" font-size="11" fill="#075985">x_mut ∈ {0,1}³⁶⁸⁶</text>
  <text x="860" y="336" text-anchor="middle" font-size="11" fill="#075985">對齊後的 0/1 突變指標</text>
  <text x="860" y="356" text-anchor="middle" font-size="11" fill="#075985">較強 weight decay（1e-2）</text>
  <polyline points="860,368 860,824 713,824" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#ars)"/>
  <text x="872" y="600" font-size="11" fill="#0284c7">不經過編碼器</text>
  <text x="872" y="618" font-size="11" fill="#0284c7">與量子頭</text>

  <!-- ===== 預訓練分支（左，虛線） ===== -->
  <rect x="20" y="436" width="250" height="330" rx="10" fill="#fffbfb" stroke="#dc2626" stroke-dasharray="6 4"/>
  <text x="145" y="458" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">僅預訓練（10 epochs）·推論時不存在</text>

  <polyline points="290,300 145,300 145,434" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ard)"/>
  <polyline points="290,412 205,412 205,434" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ard)"/>
  <text x="212" y="406" font-size="11" fill="#dc2626">u_a</text>

  <rect x="35" y="472" width="220" height="66" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="145" y="498" text-anchor="middle" font-size="13" fill="#0f172a">第二個 V-D view x_b</text>
  <text x="145" y="518" text-anchor="middle" font-size="11" fill="#92400e">經同一組 f_φ / A / θ → q_b</text>
  <line x1="145" y1="538" x2="145" y2="564" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ard)"/>

  <rect x="35" y="566" width="220" height="124" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="145" y="590" text-anchor="middle" font-weight="bold" fill="#0f172a">預訓練損失</text>
  <text x="145" y="612" text-anchor="middle" font-size="12" fill="#991b1b">‖q_a − q_b‖²　（不變性）</text>
  <text x="145" y="634" text-anchor="middle" font-size="12" fill="#991b1b">+ λ · VICReg(q)　（二階白化）</text>
  <text x="145" y="656" text-anchor="middle" font-size="12" fill="#991b1b">+ μ · BCE(g(u_a), x_mut)</text>
  <text x="145" y="676" text-anchor="middle" font-size="11" fill="#dc2626">μ = 1（重建項，§3.5）</text>

  <text x="145" y="712" text-anchor="middle" font-size="11" fill="#64748b">g：ℝ¹²⁸ → ℝ³⁶⁸⁶ 輕量解碼頭</text>
  <text x="145" y="730" text-anchor="middle" font-size="11" fill="#64748b">不變性對齊的是定序 nuisance，</text>
  <text x="145" y="748" text-anchor="middle" font-size="11" fill="#64748b">重建項防止丟掉突變內容</text>

  <polyline points="290,716 276,716 276,660 258,660" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ard)"/>

  <!-- ===== 對照組與腳註 ===== -->
  <rect x="20" y="800" width="250" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 4"/>
  <text x="145" y="822" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">對照組（替換上方量子線路與讀出）</text>
  <text x="145" y="844" text-anchor="middle" font-size="11" fill="#475569">寬度匹配古典 MLP 頭</text>
  <text x="145" y="862" text-anchor="middle" font-size="11" fill="#475569">64 → 128 → 128，tanh 有界</text>
  <text x="145" y="880" text-anchor="middle" font-size="11" fill="#475569">隱藏層 = 讀出維度 m = 128</text>
  <text x="145" y="898" text-anchor="middle" font-size="11" fill="#475569">參數 24,832（≫ 量子的 512）</text>

  <text x="500" y="985" text-anchor="middle" font-size="11" fill="#64748b">共享路徑（編碼器 + A + C）256,704 參數　|　量子線路 512　|　寬度匹配古典頭 24,832　|　跳接 W_s 為 3,686 × 22</text>
  <text x="500" y="1005" text-anchor="middle" font-size="11" fill="#64748b">三個評估協定：凍結探針（表徵品質）· fine-tune（任務分數）· scratch fine-tune（跳過預訓練，衡量預訓練貢獻）</text>
  <text x="500" y="1027" text-anchor="middle" font-size="11" fill="#94a3b8">程式對應：views.nuisance_view / encoder.latent / qhead.MultiQuantumHead / finetune.Classifier / pretrain.recon_targets</text>
</svg>
