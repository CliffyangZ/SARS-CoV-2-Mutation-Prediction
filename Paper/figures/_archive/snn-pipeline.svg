<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">SARS-CoV-2 spike 序列分類流程</title>
  <desc id="desc">Spike 蛋白序列經 one-hot 編碼與零填充後輸入脈衝神經網路，輸出病毒譜系分類。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#365f91"/></marker>
    <style>
      .box{fill:#f4f7fb;stroke:#365f91;stroke-width:2.5;rx:18}
      .head{font:700 22px sans-serif;fill:#19324d}
      .sub{font:16px sans-serif;fill:#42566d}
      .arrow{stroke:#365f91;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="28" y="70" width="245" height="190" class="box"/>
  <text x="150" y="112" text-anchor="middle" class="head">Spike 蛋白序列</text>
  <text x="150" y="157" text-anchor="middle" class="sub">不同長度的胺基酸序列</text>
  <text x="150" y="205" text-anchor="middle" class="sub">例：MFVFLVLLPL…</text>
  <path d="M278 165 H327" class="arrow"/>
  <rect x="337" y="70" width="245" height="190" class="box"/>
  <text x="459" y="112" text-anchor="middle" class="head">數值化前處理</text>
  <text x="459" y="157" text-anchor="middle" class="sub">One-hot 編碼</text>
  <text x="459" y="190" text-anchor="middle" class="sub">零填充以對齊長度</text>
  <path d="M587 165 H636" class="arrow"/>
  <rect x="646" y="70" width="245" height="190" class="box"/>
  <text x="768" y="112" text-anchor="middle" class="head">脈衝神經網路</text>
  <text x="768" y="157" text-anchor="middle" class="sub">兩層線性層</text>
  <text x="768" y="190" text-anchor="middle" class="sub">隨時間累積並發放脈衝</text>
  <path d="M896 165 H945" class="arrow"/>
  <rect x="955" y="70" width="215" height="190" class="box"/>
  <text x="1062" y="112" text-anchor="middle" class="head">譜系分類</text>
  <text x="1062" y="157" text-anchor="middle" class="sub">預測 SARS-CoV-2</text>
  <text x="1062" y="190" text-anchor="middle" class="sub">病毒譜系類別</text>
  <text x="600" y="315" text-anchor="middle" class="sub">依論文方法流程繪製；此圖為流程摘要，非原論文圖表。</text>
</svg>
